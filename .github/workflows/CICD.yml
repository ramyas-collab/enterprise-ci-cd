name: Enterprise CI/CD Pipeline

# =========================================================
# EVENTS / TRIGGERS
# =========================================================

on:

  # Run when code is pushed
  push:
    branches:
      - main
      - develop

  # Run when a Pull Request is created/updated
  pull_request:
    branches:
      - main

  # Run manually from GitHub UI
  workflow_dispatch:
    inputs:

      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
        default: dev

      run_tests:
        description: "Run tests?"
        required: false
        type: boolean
        default: true

      version:
        description: "Application version"
        required: false
        type: string
        default: "1.0.0"


# =========================================================
# GLOBAL ENVIRONMENT VARIABLES
# =========================================================

env:

  APP_NAME: ${{ env.APP_NAME }}
  NODE_VERSION: ${{ env.NODE_VERSION }}
  BUILD_DIRECTORY: ${{ env.BUILD_DIRECTORY }}


# =========================================================
# PERMISSIONS
# =========================================================

permissions:

  contents: read


# =========================================================
# JOBS
# =========================================================

jobs:

  # =======================================================
  # JOB 1 - PREPARE
  # =======================================================

  prepare:

    name: Prepare Build

    runs-on: ubuntu-latest

    # Job-level environment variables
    env:
      BUILD_ENV: ${{ vars.BUILD_ENV }}

    # Outputs generated by this job
    outputs:

      app_version: ${{ steps.version.outputs.app_version }}

      artifact_name: ${{ steps.version.outputs.artifact_name }}

    steps:

      # -----------------------------------------------
      # Step 1
      # -----------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4

      # -----------------------------------------------
      # Step 2
      # -----------------------------------------------

      - name: Display GitHub information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Actor: $GITHUB_ACTOR"

      # -----------------------------------------------
      # Step 3
      # Generate outputs
      # -----------------------------------------------

      - name: Calculate application version
        id: version
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="1.0.${{ github.run_number }}"
          fi

          ARTIFACT_NAME="${{ env.APP_NAME }}-${VERSION}"

          echo "Application version: $VERSION"
          echo "Artifact name: $ARTIFACT_NAME"

          # Step outputs
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"


  # =======================================================
  # JOB 2 - BUILD
  # =======================================================

  build:

    name: Build Application

    needs: prepare

    runs-on: ubuntu-latest

    strategy:

      matrix:
        node-version:
          - "20"
          - "22"

    env:

      VERSION: ${{ needs.prepare.outputs.app_version }}

    steps:

      # -----------------------------------------------
      # Checkout
      # -----------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4

      # -----------------------------------------------
      # Setup Node
      # -----------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # -----------------------------------------------
      # CACHE
      # -----------------------------------------------

      - name: Cache npm dependencies
        uses: actions/cache@v4

        with:

          path: ~/.npm

          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}

          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      # -----------------------------------------------
      # Install dependencies
      # -----------------------------------------------

      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------
      # Build
      # -----------------------------------------------

      - name: Build application
        run: |
          echo "Building $APP_NAME"
          echo "Version: $VERSION"
          echo "Node version: ${{ matrix.node-version }}"

          npm run build

      # -----------------------------------------------
      # Create artifact
      # -----------------------------------------------

      - name: Package application
        run: |

          mkdir -p package

          cp -r $BUILD_DIRECTORY/* package/

          echo "$VERSION" > package/version.txt

      # -----------------------------------------------
      # Upload artifact
      # -----------------------------------------------

      - name: Upload build artifact
        uses: actions/upload-artifact@v4

        with:

          name: ${{ needs.prepare.outputs.artifact_name }}-node-${{ matrix.node-version }}

          path: package/

          retention-days: 7


  # =======================================================
  # JOB 3 - TEST
  # =======================================================

  test:

    name: Test Application

    needs:
      - prepare
      - build

    runs-on: ubuntu-latest

    # Condition using workflow input
    if: ${{ inputs.run_tests != false }}

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      # -----------------------------------------------
      # Download artifact
      # -----------------------------------------------

      - name: Download build artifact
        uses: actions/download-artifact@v4

        with:
          pattern: ${{ needs.prepare.outputs.artifact_name }}-*
          merge-multiple: true
          path: test-package

      # -----------------------------------------------
      # Run tests
      # -----------------------------------------------

      - name: Run tests
        run: |

          echo "Running tests..."

          ls -la test-package

          npm ci

          npm test


  # =======================================================
  # JOB 4 - DEPLOY
  # =======================================================

  deploy:

    name: Deploy Application

    needs:
      - prepare
      - test

    # Only deploy from main
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment || 'dev' }}

    env:

      VERSION: ${{ needs.prepare.outputs.app_version }}

      # Secret
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

    steps:

      - name: Download artifact
        uses: actions/download-artifact@v4

        with:

          pattern: ${{ needs.prepare.outputs.artifact_name }}-*
          merge-multiple: true
          path: deployment-package

      - name: Deploy application
        run: |

          echo "Deploying application..."

          echo "Application: $APP_NAME"
          echo "Version: $VERSION"
          echo "Environment: ${{ inputs.environment || 'dev' }}"

          # Never print the actual secret
          if [ -n "$DEPLOY_TOKEN" ]; then
            echo "Deployment token is available"
          fi

          # Example deployment
          ./deploy.sh deployment-package


  # =======================================================
  # JOB 5 - REUSABLE WORKFLOW
  # =======================================================

  production-deployment:

    name: Production Deployment

    needs:
      - prepare
      - test

    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'production'

    uses: ./.github/workflows/reusable-deploy.yml

    with:

      application-name: ${{ env.APP_NAME }}

      version: ${{ needs.prepare.outputs.app_version }}

      environment: production

    secrets: inherit
