name: Enterprise CI/CD Pipeline

# ============================================================
# EVENTS
# ============================================================

on:

  # Automatically run when code is pushed
  push:
    branches:
      - main
      - develop

  # Automatically run for Pull Requests targeting main
  pull_request:
    branches:
      - main

  # Allow manual execution from GitHub UI
  workflow_dispatch:

    inputs:

      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
        default: dev

      version:
        description: "Application version"
        required: true
        type: string
        default: "1.0.0"

      run_tests:
        description: "Run tests?"
        required: true
        type: boolean
        default: true


# ============================================================
# GLOBAL ENVIRONMENT VARIABLES
# These are optional.
#
# We are getting the values from GitHub Variables instead of
# hard-coding them.
# ============================================================

env:

  APP_NAME: ${{ vars.APP_NAME }}
  BUILD_DIRECTORY: ${{ vars.BUILD_DIRECTORY }}


# ============================================================
# PERMISSIONS
# ============================================================

permissions:

  contents: read


# ============================================================
# JOBS
# ============================================================

jobs:


  # ==========================================================
  # JOB 1 - PREPARE
  # ==========================================================

  prepare:

    name: Prepare Build

    runs-on: ubuntu-latest

    # --------------------------------------------------------
    # Job outputs
    # --------------------------------------------------------

    outputs:

      app_version: ${{ steps.version.outputs.app_version }}

      artifact_name: ${{ steps.version.outputs.artifact_name }}


    steps:

      # ------------------------------------------------------
      # STEP 1 - Checkout
      # ------------------------------------------------------

      - name: Checkout source code

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # STEP 2 - Display GitHub information
      # ------------------------------------------------------

      - name: Display GitHub information

        run: |

          echo "Repository: $GITHUB_REPOSITORY"

          echo "Branch: $GITHUB_REF"

          echo "Commit: $GITHUB_SHA"

          echo "Triggered by: $GITHUB_ACTOR"

          echo "Event: $GITHUB_EVENT_NAME"


      # ------------------------------------------------------
      # STEP 3 - Generate version
      # ------------------------------------------------------

      - name: Generate application version

        id: version

        shell: bash

        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            VERSION="${{ inputs.version }}"

          else

            VERSION="1.0.${{ github.run_number }}"

          fi


          ARTIFACT_NAME="${{ vars.APP_NAME }}-${VERSION}"


          echo "Application version: $VERSION"

          echo "Artifact name: $ARTIFACT_NAME"


          # Step outputs

          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"



  # ==========================================================
  # JOB 2 - BUILD
  # ==========================================================

  build:

    name: Build Application

    needs: prepare

    runs-on: ubuntu-latest


    # --------------------------------------------------------
    # MATRIX
    #
    # This creates two build executions:
    #
    # Node 20
    # Node 22
    # --------------------------------------------------------

    strategy:

      matrix:

        node-version:
          - "20"
          - "22"


    steps:

      # ------------------------------------------------------
      # STEP 1 - Checkout
      # ------------------------------------------------------

      - name: Checkout source code

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # STEP 2 - Setup Node
      # ------------------------------------------------------

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: ${{ matrix.node-version }}


      # ------------------------------------------------------
      # STEP 3 - CACHE
      # ------------------------------------------------------

      - name: Cache npm dependencies

        uses: actions/cache@v4

        with:

          path: ~/.npm

          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}

          restore-keys: |

            ${{ runner.os }}-node-${{ matrix.node-version }}-

            ${{ runner.os }}-node-


      # ------------------------------------------------------
      # STEP 4 - Install dependencies
      # ------------------------------------------------------

      - name: Install dependencies

        run: |

          npm ci


      # ------------------------------------------------------
      # STEP 5 - Build application
      # ------------------------------------------------------

      - name: Build application

        run: |

          echo "Application: $APP_NAME"

          echo "Version: ${{ needs.prepare.outputs.app_version }}"

          echo "Node version: ${{ matrix.node-version }}"

          echo "Build directory: $BUILD_DIRECTORY"


          npm run build


      # ------------------------------------------------------
      # STEP 6 - Package application
      # ------------------------------------------------------

      - name: Package application

        shell: bash

        run: |

          mkdir -p package


           cp -r dist/* package/


          echo "${{ needs.prepare.outputs.app_version }}" \
            > package/version.txt


          echo "${{ vars.APP_NAME }}" \
            > package/application-name.txt


      # ------------------------------------------------------
      # STEP 7 - Upload artifact
      # ------------------------------------------------------

      - name: Upload build artifact

        uses: actions/upload-artifact@v4

        with:

          name: ${{ needs.prepare.outputs.artifact_name }}-node-${{ matrix.node-version }}

          path: package/

          retention-days: 7



  # ==========================================================
  # JOB 3 - TEST
  # ==========================================================

  test:

    name: Test Application

    needs:

      - prepare
      - build

    runs-on: ubuntu-latest


    # --------------------------------------------------------
    # Run tests unless the user selected false during
    # manual execution.
    #
    # For push/PR, inputs.run_tests is empty, so the condition
    # evaluates to true.
    # --------------------------------------------------------

    if: ${{ inputs.run_tests != false }}


    steps:

      # ------------------------------------------------------
      # STEP 1 - Checkout
      # ------------------------------------------------------

      - name: Checkout source code

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # STEP 2 - Download artifacts
      # ------------------------------------------------------

      - name: Download build artifacts

        uses: actions/download-artifact@v4

        with:

          pattern: ${{ needs.prepare.outputs.artifact_name }}-*

          merge-multiple: true

          path: test-package


      # ------------------------------------------------------
      # STEP 3 - Display artifact
      # ------------------------------------------------------

      - name: Inspect build package

        run: |

          echo "Downloaded build artifacts:"

          ls -la test-package


      # ------------------------------------------------------
      # STEP 4 - Install dependencies
      # ------------------------------------------------------

      - name: Install dependencies

        run: |

          npm ci


      # ------------------------------------------------------
      # STEP 5 - Run tests
      # ------------------------------------------------------

      - name: Run tests

        run: |

          echo "Running application tests..."

          npm test



  # ==========================================================
  # JOB 4 - DEPLOY
  # ==========================================================

  deploy:

    name: Deploy Application

    needs:

      - prepare
      - test

    runs-on: ubuntu-latest


    # --------------------------------------------------------
    # Only deploy from main.
    #
    # Pull requests will not deploy.
    # --------------------------------------------------------

    if: |

      github.ref == 'refs/heads/main' &&

      github.event_name != 'pull_request'


    # --------------------------------------------------------
    # GitHub Environment
    #
    # The environment is selected from manual input.
    # For push to main, it defaults to dev.
    # --------------------------------------------------------

    environment:

      name: ${{ inputs.environment || 'dev' }}


    steps:

      # ------------------------------------------------------
      # STEP 1 - Download artifact
      # ------------------------------------------------------

      - name: Download build artifacts

        uses: actions/download-artifact@v4

        with:

          pattern: ${{ needs.prepare.outputs.artifact_name }}-*

          merge-multiple: true

          path: deployment-package


      # ------------------------------------------------------
      # STEP 2 - Display deployment information
      # ------------------------------------------------------

      - name: Display deployment information

        run: |

          echo "================================="

          echo "Deployment"

          echo "================================="

          echo "Application: $APP_NAME"

          echo "Version: ${{ needs.prepare.outputs.app_version }}"

          echo "Environment: ${{ inputs.environment || 'dev' }}"

          echo "Package: deployment-package"


      # ------------------------------------------------------
      # STEP 3 - Deploy
      # ------------------------------------------------------

      - name: Deploy application

        env:

          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

        run: |

          echo "Starting deployment..."


          if [ -z "$DEPLOY_TOKEN" ]; then

            echo "ERROR: DEPLOY_TOKEN is not configured."

            exit 1

          fi


          echo "Deployment token is available."

          echo "Deploying application..."

          echo "Deployment completed successfully."



  # ==========================================================
  # JOB 5 - CALL REUSABLE WORKFLOW
  # ==========================================================

  production-deployment:

    name: Production Deployment

    needs:

      - prepare
      - test


    # --------------------------------------------------------
    # Only call reusable workflow when:
    #
    # 1. Manual workflow execution
    # 2. Environment = production
    # --------------------------------------------------------

    if: |

      github.event_name == 'workflow_dispatch' &&

      inputs.environment == 'production'


    # --------------------------------------------------------
    # REUSABLE WORKFLOW
    # --------------------------------------------------------

    uses: ./.github/workflows/reusable-deploy.yml


    # --------------------------------------------------------
    # Pass inputs to reusable workflow
    #
    # IMPORTANT:
    #
    # Use vars.APP_NAME here.
    #
    # Do NOT use env.APP_NAME here.
    # --------------------------------------------------------

    with:

      application-name: ${{ vars.APP_NAME }}

      version: ${{ needs.prepare.outputs.app_version }}

      environment: production


    # --------------------------------------------------------
    # Pass secrets
    # --------------------------------------------------------

    secrets: inherit
